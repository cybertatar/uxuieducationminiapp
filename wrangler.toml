name = "ux-quiz"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Собранный Vite фронтенд. /api/*, /bot/* и /share-img/* обрабатывает воркер.
[assets]
directory = "./dist"
run_worker_first = ["/api/*", "/bot/*", "/share-img/*"]

[[d1_databases]]
binding = "DB"
database_name = "ux-quiz"
# При деплое через GitHub Actions сверяется по имени базы (см. .github/workflows/deploy.yml)
database_id = "64f38ab4-2b54-4bef-ad4c-e9045fb668e0"
migrations_dir = "migrations"

# Раз в минуту: вопросы дня и напоминания о стрике
[triggers]
crons = ["* * * * *"]

[vars]
WEBAPP_URL = "https://ux-quiz.tyncherovmail.workers.dev"
